<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Manage New Grad SWE Jobs email alerts.">
    <title>{{ title }} · New Grad SWE Jobs</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v={{ styles_version }}">
  </head>
  <body>
    <header class="site-header">
      <a href="/">New Grad SWE Jobs</a>
    </header>
    <main class="subscription-page">
      <section class="subscription-card" aria-labelledby="subscription-title">
        <h1 id="subscription-title">{{ title }}</h1>
        <p>{{ message }}</p>
        {% if unsubscribe_token %}
        <form method="post" action="/unsubscribe?token={{ unsubscribe_token|urlencode }}">
          <button type="submit">Unsubscribe</button>
        </form>
        {% else %}
        <a class="button-link" href="/">Back to the job board</a>
        {% endif %}
      </section>
    </main>
  </body>
</html>
