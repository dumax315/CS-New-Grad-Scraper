<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Manage New Grad SWE Jobs email alerts.">
    <title>{{ title }} · New Grad SWE Jobs</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="New Grad SWE Jobs home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>New Grad SWE Jobs</span>
      </a>
    </header>
    <main class="subscription-page">
      <section class="subscription-card" aria-labelledby="subscription-title">
        <p class="eyebrow">{{ "ALL SET" if success else "EMAIL ALERTS" }}</p>
        <h1 id="subscription-title">{{ title }}</h1>
        <p>{{ message }}</p>
        {% if unsubscribe_token %}
        <form method="post" action="/unsubscribe?token={{ unsubscribe_token|urlencode }}">
          <button type="submit">Unsubscribe</button>
        </form>
        {% else %}
        <a class="apply-button" href="/">Back to the job board</a>
        {% endif %}
      </section>
    </main>
  </body>
</html>
