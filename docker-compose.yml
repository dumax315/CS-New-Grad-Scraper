services:
  web:
    build: .
    restart: unless-stopped
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DATABASE}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Los_Angeles}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_RECIPIENT: ${ALERT_RECIPIENT:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SUBSCRIPTION_TOKEN_SECRET: ${SUBSCRIPTION_TOKEN_SECRET:-}
      APPLY_LIFECYCLE_VISIBILITY: ${APPLY_LIFECYCLE_VISIBILITY:-true}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-luna}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-120}
      CODEX_HOME: ${CODEX_HOME:-/var/lib/codex}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    volumes:
      - codex_data:/var/lib/codex
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  codex_data:
  postgres_data:
